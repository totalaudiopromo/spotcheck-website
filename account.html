<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Subscription - Spot Check</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      color: #94A3B8;
      background: #08090C;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .bg-glow {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 30%, rgba(0, 245, 155, 0.1) 0%, transparent 60%);
      pointer-events: none;
    }
    .card {
      position: relative;
      max-width: 480px;
      width: 100%;
      background: rgba(18, 22, 33, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2.5rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 30px rgba(0, 245, 155, 0.15);
    }
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 1rem; color: #fff; letter-spacing: -0.02em; }
    p { color: #94A3B8; margin-bottom: 1rem; font-size: 0.95rem; }
    a { color: #00F59B; text-decoration: none; }
    .btn-portal {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #00F59B, #10B981);
      color: #08090C;
      font-weight: 800;
      padding: 14px 24px;
      border-radius: 500px;
      margin-top: 12px;
      box-shadow: 0 4px 20px rgba(0, 245, 155, 0.3);
      transition: all 0.2s ease;
    }
    .btn-portal:hover { transform: translateY(-2px); box-shadow: 0 6px 26px rgba(0, 245, 155, 0.45); }
    .meta { color: #64748B; font-size: 0.85rem; margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 1rem; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="card">
    <h1>Manage Subscription</h1>
    <p>Update your payment details, switch plans, or cancel anytime — all self-serve through our secure Stripe billing portal.</p>
    <p><a href="https://api.spotcheck.cc/api/portal" class="btn-portal">Manage Subscription &rarr;</a></p>
    <div class="meta">You'll be asked to sign in if you aren't already. Questions? Contact <a href="mailto:info@totalaudiopromo.com">info@totalaudiopromo.com</a>.</div>
  </div>
</body>
</html>
